<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama Entidad-Relación - Base de Datos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0e11;
            color: #e1e4ea;
            overflow: hidden;
            user-select: none;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Grid Background Pattern */
        .canvas-bg {
            background-color: #111216;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 24px 24px, 12px 12px;
            background-position: 0 0, 12px 12px;
        }

        /* ER Table Card Styling */
        .er-card {
            position: absolute;
            background: #1c1e24;
            border: 1px solid #2d313b;
            border-radius: 8px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
            width: 250px;
            cursor: move;
            transition: border-color 0.2s, box-shadow 0.2s;
            z-index: 10;
        }

        .er-card:hover {
            border-color: #4f5666;
            box-shadow: 0 12px 36px -5px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(99, 102, 241, 0.3);
        }

        .er-card.selected {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5), 0 12px 36px -5px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        .er-card-header {
            background: #23262f;
            border-bottom: 1px solid #2d313b;
            border-top-left-radius: 7px;
            border-top-right-radius: 7px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .er-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            font-size: 11px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            height: 26px;
        }

        .er-row:last-child {
            border-bottom: none;
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }

        .er-row:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.015);
        }

        .badge-pk {
            color: #f59e0b;
            font-size: 9px;
            font-weight: 700;
        }

        .badge-fk {
            color: #3b82f6;
            font-size: 9px;
            font-weight: 700;
        }

        .badge-nn {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-size: 8.5px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        /* Custom Scrollbar for Controls */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111216;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d313b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4f5666;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col antialiased">

    <!-- Top Navigation Header -->
    <header class="h-14 bg-[#16181e] border-b border-[#262932] px-4 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center space-x-3">

                </h1>
                <p class="text-xs text-gray-400">Esquema `public` &bull; 15 Tablas &bull; Relaciones FK</p>
            </div>
        </div>

        <!-- Action Toolbar -->
        <div class="flex items-center space-x-2">
            <button id="btnResetView" title="Restablecer Vista" class="p-2 text-gray-400 hover:text-white bg-[#20232a] hover:bg-[#2a2e38] rounded-md border border-[#303440] text-xs transition flex items-center gap-1.5">
                <i class="fa-solid fa-compress"></i>

            </button>

                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>

            </button>
            
            <div class="h-5 w-[1px] bg-[#2d313b] mx-1"></div>

            <button id="btnExportSVG" class="px-3 py-1.5 text-xs font-medium bg-[#232730] hover:bg-[#2d323e] text-indigo-300 hover:text-indigo-200 border border-indigo-500/30 rounded-md transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-code text-indigo-400"></i>

                <i class="fa-solid fa-download"></i>

        </div>
    </header>

    <!-- Canvas Container -->
    <div id="viewport" class="flex-1 relative overflow-hidden canvas-bg cursor-grab active:cursor-grabbing">
        
        <!-- SVG Canvas layer for Relationships -->
        <svg id="svgLayer" class="absolute inset-0 w-full h-full pointer-events-none z-0" style="overflow: visible;">
            <defs>
                <!-- Arrow/Marker definitions for Crow's foot or connectors -->
                <marker id="marker-one" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <circle cx="5" cy="5" r="3" fill="#6366f1" stroke="#818cf8" stroke-width="1.5" />
                </marker>
                <marker id="marker-many" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 2 L 10 6 L 0 10 M 10 0 L 10 12" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </marker>
                
                <filter id="line-shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
                </filter>
            </defs>
            <g id="connectionsGroup"></g>
        </svg>

        <!-- HTML Cards Layer -->
        <div id="diagramContainer" class="absolute inset-0 transform-gpu origin-0-0">
            <!-- Table Cards dynamically injected here -->
        </div>

        <!-- Floating Controls Panel -->
        <div class="absolute bottom-4 right-4 bg-[#1c1e24]/90 backdrop-blur-md border border-[#2d313b] rounded-lg p-1.5 flex items-center gap-1 shadow-2xl z-40">
            <button id="btnZoomIn" class="p-2 text-gray-300 hover:text-white hover:bg-[#282b34] rounded transition" title="Acercar">
                <i class="fa-solid fa-plus"></i>
            </button>
            <span id="zoomLevel" class="text-xs code-font text-gray-400 px-2 min-w-[45px] text-center">100%</span>
            <button id="btnZoomOut" class="p-2 text-gray-300 hover:text-white hover:bg-[#282b34] rounded transition" title="Alejar">

            <div class="h-4 w-[1px] bg-[#2d313b] mx-1"></div>
            <button id="btnFitScreen" class="p-2 text-gray-300 hover:text-white hover:bg-[#282b34] rounded transition" title="Ajustar a Pantalla">

        <!-- Legend Overlay -->

            <div class="flex items-center gap-1.5">

            },

                ]
            },
            {
                name: 'education',
                x: 420, y: 320,
                columns: [
                    { name: 'id', type: 'INTEGER', pk: true, nn: true },
                    { name: 'profile_id', type: 'INTEGER', fk: true, nn: false },
                    { name: 'type_id', type: 'INTEGER', fk: true, nn: false },
                    { name: 'start_date', type: 'DATE', nn: false },
                    { name: 'end_date', type: 'DATE', nn: false },
                    { name: 'url', type: 'TEXT', nn: false },
                    { name: 'is_active', type: 'BOOLEAN', nn: false },
                    { name: 'created_at', type: 'TIMESTAMPTZ', nn: false },
                    { name: 'institution', type: 'VARCHAR(150)', nn: true },
                    { name: 'location', type: 'VARCHAR(100)', nn: false }

            },
            {

                x: 60, y: 320,
                columns: [

                    { name: 'language_code', type: 'CHAR(2)', nn: true },
                    { name: 'title', type: 'VARCHAR(150)', nn: true },
                    { name: 'created_at', type: 'TIMESTAMPTZ', nn: false },

                ]

        // Relationships (1 to N)
        const relationships = [
            { from: 'profiles', fromCol: 'id', to: 'profiles_titles', toCol: 'profile_id' },
            { from: 'profiles_titles', fromCol: 'id', to: 'profiles_titles_translations', toCol: 'title_id' },
            { from: 'profiles', fromCol: 'id', to: 'summaries', toCol: 'profile_id' },
            { from: 'summaries', fromCol: 'id', to: 'summaries_translations', toCol: 'summary_id' },
            { from: 'profiles', fromCol: 'id', to: 'skills', toCol: 'profile_id' },
            { from: 'skill_types', fromCol: 'id', to: 'skills', toCol: 'type_id' },
            { from: 'skills', fromCol: 'id', to: 'skill_translations', toCol: 'skill_id' },
            { from: 'profiles', fromCol: 'id', to: 'experiences', toCol: 'profile_id' },
            { from: 'experiences', fromCol: 'id', to: 'experiences_translations', toCol: 'experience_id' },
            { from: 'experiences', fromCol: 'id', to: 'responsibilities', toCol: 'experience_id' },
            { from: 'responsibilities', fromCol: 'id', to: 'responsibilities_translations', toCol: 'responsibility_id' },
            { from: 'profiles', fromCol: 'id', to: 'education', toCol: 'profile_id' },
            { from: 'education_types', fromCol: 'id', to: 'education', toCol: 'type_id' },
            { from: 'education', fromCol: 'id', to: 'education_translations', toCol: 'education_id' }
        ];

        // Viewport & Pan/Zoom state
        let scale = 0.85;
        let panX = 40;
        let panY = 40;
        let isPanning = false;
        let startX = 0;
        let startY = 0;

        // Card Dragging State
        let draggedCard = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('diagramContainer');
        const svgLayer = document.getElementById('svgLayer');
        const connectionsGroup = document.getElementById('connectionsGroup');

        // --- Render Diagram ---
        function initDiagram() {
            container.innerHTML = '';
            
            schema.forEach(table => {
                const card = document.createElement('div');
                card.className = 'er-card';
                card.id = `table-${table.name}`;
                card.style.left = `${table.x}px`;
                card.style.top = `${table.y}px`;

                let rowsHtml = '';
                table.columns.forEach(col => {
                    let badge = '';
                    if (col.pk) badge += `<span class="badge-pk flex items-center gap-1"><i class="fa-solid fa-key text-[8px]"></i>PK</span>`;
                    if (col.fk) badge += `<span class="badge-fk flex items-center gap-1"><i class="fa-solid fa-link text-[8px]"></i>FK</span>`;

                    let nnBadge = col.nn ? `<span class="badge-nn">NN</span>` : '';

                    rowsHtml += `
                        <div class="er-row" data-col="${col.name}">
                            <div class="flex items-center gap-1.5 overflow-hidden pr-1">
                                <span class="w-8 shrink-0 flex items-center">${badge}</span>
                                <span class="code-font font-medium text-gray-200 truncate" title="${col.name}">${col.name}</span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <span class="code-font text-[10px] text-gray-400">${col.type}</span>
                                ${nnBadge}
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="er-card-header">
                        <span class="code-font font-bold text-xs text-gray-100 flex items-center gap-1.5">
                            <i class="fa-solid fa-table text-indigo-400 text-[10px]"></i>
                            ${table.name}
                        </span>
                        <span class="text-[10px] text-gray-500 code-font">${table.columns.length}</span>
                    </div>
                    <div>
                        ${rowsHtml}
                    </div>
                `;

                // Card Mouse Events for Dragging
                card.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    draggedCard = table;
                    dragOffsetX = (e.clientX - panX) / scale - table.x;
                    dragOffsetY = (e.clientY - panY) / scale - table.y;
                    
                    document.querySelectorAll('.er-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                });

                container.appendChild(card);
            });

            updateTransform();
            renderConnections();
        }

        // --- Render SVG Connections ---
        function renderConnections() {
            connectionsGroup.innerHTML = '';

            relationships.forEach(rel => {
                const fromTable = schema.find(t => t.name === rel.from);
                const toTable = schema.find(t => t.name === rel.to);

                if (!fromTable || !toTable) return;

                const fromCard = document.getElementById(`table-${rel.from}`);
                const toCard = document.getElementById(`table-${rel.to}`);

                if (!fromCard || !toCard) return;

                // Compute bounding rects in world coordinates
                const fromRect = { x: fromTable.x, y: fromTable.y, w: fromCard.offsetWidth, h: fromCard.offsetHeight };
                const toRect = { x: toTable.x, y: toTable.y, w: toCard.offsetWidth, h: toCard.offsetHeight };

                // Calculate smart anchor points
                const points = calculateOrthogonalPath(fromRect, toRect);

                // Create SVG Path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', points.pathD);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', '#6366f1');
                path.setAttribute('stroke-width', '1.8');
                path.setAttribute('stroke-opacity', '0.85');
                path.setAttribute('marker-start', 'url(#marker-one)');
                path.setAttribute('marker-end', 'url(#marker-many)');
                path.setAttribute('filter', 'url(#line-shadow)');

                connectionsGroup.appendChild(path);
            });
        }

        // Calculates smooth orthogonal bezier path between cards
        function calculateOrthogonalPath(r1, r2) {
            let p1 = { x: 0, y: 0 };
            let p2 = { x: 0, y: 0 };
            let c1 = { x: 0, y: 0 };
            let c2 = { x: 0, y: 0 };

            // Determine relative position to attach left/right/top/bottom
            const center1 = { x: r1.x + r1.w / 2, y: r1.y + r1.h / 2 };
            const center2 = { x: r2.x + r2.w / 2, y: r2.y + r2.h / 2 };

            const dx = center2.x - center1.x;
            const dy = center2.y - center1.y;

            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal Connection
                if (dx > 0) {
                    p1 = { x: r1.x + r1.w, y: r1.y + Math.min(r1.h - 15, Math.max(25, r1.h / 2)) };
                    p2 = { x: r2.x, y: r2.y + Math.min(r2.h - 15, Math.max(25, r2.h / 2)) };
                } else {
                    p1 = { x: r1.x, y: r1.y + Math.min(r1.h - 15, Math.max(25, r1.h / 2)) };
                    p2 = { x: r2.x + r2.w, y: r2.y + Math.min(r2.h - 15, Math.max(25, r2.h / 2)) };
                }
                const curveOffset = Math.min(Math.abs(dx) * 0.5, 120);
                c1 = { x: p1.x + (dx > 0 ? curveOffset : -curveOffset), y: p1.y };
                c2 = { x: p2.x + (dx > 0 ? -curveOffset : curveOffset), y: p2.y };
            } else {
                // Vertical Connection
                if (dy > 0) {
                    p1 = { x: r1.x + r1.w / 2, y: r1.y + r1.h };
                    p2 = { x: r2.x + r2.w / 2, y: r2.y };
                } else {
                    p1 = { x: r1.x + r1.w / 2, y: r1.y };
                    p2 = { x: r2.x + r2.w / 2, y: r2.y + r2.h };
                }
                const curveOffset = Math.min(Math.abs(dy) * 0.5, 120);
                c1 = { x: p1.x, y: p1.y + (dy > 0 ? curveOffset : -curveOffset) };
                c2 = { x: p2.x, y: p2.y + (dy > 0 ? -curveOffset : curveOffset) };
            }

            return {
                pathD: `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`
            };
        }

        // --- Transform / Pan & Zoom ---
        function updateTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            
            // Sync SVG coordinate system with container transform
            svgLayer.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
            
            document.getElementById('zoomLevel').innerText = `${Math.round(scale * 100)}%`;
        }

        // Viewport Dragging (Pan)
        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target === svgLayer || e.target.id === 'diagramContainer') {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
                document.querySelectorAll('.er-card').forEach(c => c.classList.remove('selected'));
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            } else if (draggedCard) {
                draggedCard.x = (e.clientX - panX) / scale - dragOffsetX;
                draggedCard.y = (e.clientY - panY) / scale - dragOffsetY;

                const cardEl = document.getElementById(`table-${draggedCard.name}`);
                if (cardEl) {
                    cardEl.style.left = `${draggedCard.x}px`;
                    cardEl.style.top = `${draggedCard.y}px`;
                }
                renderConnections();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            draggedCard = null;
        });

        // Zoom Controls
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
            const newScale = Math.min(Math.max(scale * zoomFactor, 0.2), 2.5);
            
            // Zoom towards mouse cursor
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            
            scale = newScale;
            updateTransform();
        });

        document.getElementById('btnZoomIn').addEventListener('click', () => {
            scale = Math.min(scale * 1.15, 2.5);
            updateTransform();
        });

        document.getElementById('btnZoomOut').addEventListener('click', () => {
            scale = Math.max(scale / 1.15, 0.2);
            updateTransform();
        });

        document.getElementById('btnResetView').addEventListener('click', fitToScreen);
        document.getElementById('btnFitScreen').addEventListener('click', fitToScreen);

        function fitToScreen() {
            scale = 0.65;
            panX = 50;
            panY = 60;
            updateTransform();
            showToast("Vista reajustada");
        }

        document.getElementById('btnAutoLayout').addEventListener('click', () => {
            // Preset organized positions
            const layoutPositions = {
                'profiles': { x: 820, y: 320 },
                'profiles_titles': { x: 1220, y: 100 },
                'profiles_titles_translations': { x: 1620, y: 100 },
                'summaries': { x: 420, y: 80 },
                'summaries_translations': { x: 40, y: 80 },
                'skill_types': { x: 420, y: 640 },
                'skills': { x: 820, y: 640 },
                'skill_translations': { x: 1220, y: 640 },
                'experiences': { x: 1220, y: 350 },
                'experiences_translations': { x: 1620, y: 550 },
                'responsibilities': { x: 1620, y: 350 },
                'responsibilities_translations': { x: 2000, y: 350 },
                'education_types': { x: 40, y: 540 },
                'education': { x: 420, y: 320 },
                'education_translations': { x: 40, y: 320 }
            };

            schema.forEach(t => {
                if (layoutPositions[t.name]) {
                    t.x = layoutPositions[t.name].x;
                    t.y = layoutPositions[t.name].y;
                    const card = document.getElementById(`table-${t.name}`);
                    if (card) {
                        card.style.left = `${t.x}px`;
                        card.style.top = `${t.y}px`;
                    }
                }
            });
            renderConnections();
            showToast("Auto-ordenamiento aplicado");
        });

        // --- Export Functions ---

        // Helper: Generate standalone SVG element with inline table cards and paths
        function generateStandaloneSVG() {
            // Find bounding box of all cards
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            schema.forEach(t => {
                const card = document.getElementById(`table-${t.name}`);
                const w = card ? card.offsetWidth : 250;
                const h = card ? card.offsetHeight : 200;
                minX = Math.min(minX, t.x);
                minY = Math.min(minY, t.y);
                maxX = Math.max(maxX, t.x + w);
                maxY = Math.max(maxY, t.y + h);
            });

            const padding = 60;
            minX -= padding;
            minY -= padding;
            maxX += padding;
            maxY += padding;

            const width = maxX - minX;
            const height = maxY - minY;

            // Build SVG String
            let svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${width} ${height}" width="${width}" height="${height}">`;
            
            // Add Styles
            svgString += `
            <style>
                @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
                text { font-family: 'Inter', sans-serif; }
                .code-font { font-family: 'JetBrains Mono', monospace; }
                .bg { fill: #111216; }
                .card-bg { fill: #1c1e24; stroke: #2d313b; stroke-width: 1px; rx: 8px; }
                .header-bg { fill: #23262f; stroke: #2d313b; stroke-width: 1px; }
                .title { fill: #f3f4f6; font-size: 12px; font-weight: 700; }
                .col-name { fill: #e5e7eb; font-size: 11px; font-weight: 500; }
                .col-type { fill: #9ca3af; font-size: 10px; }
                .badge-pk { fill: #f59e0b; font-size: 9px; font-weight: 700; }
                .badge-fk { fill: #3b82f6; font-size: 9px; font-weight: 700; }
                .badge-nn-bg { fill: rgba(239, 68, 68, 0.15); rx: 3px; }
                .badge-nn-text { fill: #f87171; font-size: 8.5px; font-weight: 600; }
                .row-line { stroke: rgba(255, 255, 255, 0.03); stroke-width: 1px; }
            </style>
            <defs>
                <marker id="m-one" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <circle cx="5" cy="5" r="3" fill="#6366f1" stroke="#818cf8" stroke-width="1.5" />
                </marker>
                <marker id="m-many" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 2 L 10 6 L 0 10 M 10 0 L 10 12" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </marker>
            </defs>
            <rect x="${minX}" y="${minY}" width="${width}" height="${height}" class="bg" />
            `;

            // Draw Lines
            relationships.forEach(rel => {
                const fromTable = schema.find(t => t.name === rel.from);
                const toTable = schema.find(t => t.name === rel.to);
                const fromCard = document.getElementById(`table-${rel.from}`);
                const toCard = document.getElementById(`table-${rel.to}`);

                if (fromTable && toTable && fromCard && toCard) {
                    const r1 = { x: fromTable.x, y: fromTable.y, w: fromCard.offsetWidth, h: fromCard.offsetHeight };
                    const r2 = { x: toTable.x, y: toTable.y, w: toCard.offsetWidth, h: toCard.offsetHeight };
                    const pts = calculateOrthogonalPath(r1, r2);

                    svgString += `<path d="${pts.pathD}" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-opacity="0.9" marker-start="url(#m-one)" marker-end="url(#m-many)" />`;
                }
            });

            // Draw Tables
            schema.forEach(table => {
                const card = document.getElementById(`table-${table.name}`);
                const w = card ? card.offsetWidth : 250;
                const h = card ? card.offsetHeight : 200;

                svgString += `<g transform="translate(${table.x}, ${table.y})">`;
                // Background Card
                svgString += `<rect width="${w}" height="${h}" class="card-bg" />`;
                // Header
                svgString += `<path d="M 0 8 Q 0 0 8 0 L ${w - 8} 0 Q ${w} 0 ${w} 8 L ${w} 32 L 0 32 Z" class="header-bg" />`;
                svgString += `<text x="12" y="20" class="title code-font">📋 ${table.name}</text>`;

                // Columns
                table.columns.forEach((col, idx) => {
                    const rowY = 32 + idx * 26;
                    // Row separator
                    if (idx > 0) {
                        svgString += `<line x1="0" y1="${rowY}" x2="${w}" y2="${rowY}" class="row-line" />`;
                    }

                    const textY = rowY + 17;
                    let badgeX = 10;

                    if (col.pk) {
                        svgString += `<text x="${badgeX}" y="${textY}" class="badge-pk code-font">PK</text>`;
                        badgeX += 20;
                    }
                    if (col.fk) {
                        svgString += `<text x="${badgeX}" y="${textY}" class="badge-fk code-font">FK</text>`;
                        badgeX += 20;
                    }

                    svgString += `<text x="${Math.max(badgeX, 32)}" y="${textY}" class="col-name code-font">${col.name}</text>`;
                    
                    const typeX = w - (col.nn ? 50 : 12);
                    svgString += `<text x="${typeX}" y="${textY}" text-anchor="end" class="col-type code-font">${col.type}</text>`;

                    if (col.nn) {
                        svgString += `<rect x="${w - 38}" y="${rowY + 6}" width="26" height="14" class="badge-nn-bg" />`;
                        svgString += `<text x="${w - 25}" y="${rowY + 16}" text-anchor="middle" class="badge-nn-text code-font">NN</text>`;
                    }
                });

                svgString += `</g>`;
            });

            svgString += `</svg>`;
            return { svgString, width, height };
        }

        // Export SVG File
        document.getElementById('btnExportSVG').addEventListener('click', () => {
            const { svgString } = generateStandaloneSVG();
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'modelo_entidad_relacion.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast("Vector SVG descargado correctamente");
        });

        // Export PNG (High Resolution 2x/3x)
        document.getElementById('btnExportPNG').addEventListener('click', () => {
            showToast("Generando PNG de alta resolución...");

            const { svgString, width, height } = generateStandaloneSVG();
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const img = new Image();
            img.onload = () => {
                const scaleFactor = 2.5; // Scale for HD crisp rendering
                const canvas = document.createElement('canvas');
                canvas.width = width * scaleFactor;
                canvas.height = height * scaleFactor;

                const ctx = canvas.getContext('2d');
                ctx.scale(scaleFactor, scaleFactor);
                ctx.drawImage(img, 0, 0);

                // Convert Canvas to PNG Link
                const pngUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = pngUrl;
                link.download = 'modelo_entidad_relacion_hd.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                showToast("Imagen PNG HD exportada exitosamente");
            };
            img.src = url;
        });

        // Toast Message Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 3000);
        }

        // Initialize on Load
        window.onload = () => {
            initDiagram();
            fitToScreen();
        };

        window.addEventListener('resize', renderConnections);
    </script>
</body>
